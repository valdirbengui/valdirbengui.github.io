<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cromos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Coleção de Cromos</h1>
    </header>
    <main>
      <section id="colecao">
        <h2>A minha coleção</h2>
        <ul></ul>
        <h3>Total de cromos: <span>0</span></h3>
      </section>
      <section>
        <h2>Registar novo cromo</h2>
        <form>
          <input id="numero" type="number" placeholder="numero" required />
          <input id="botao" type="submit" value="Registar Cromo" autofocus />
        </form>
        <p id="total">0</p>
      </section>

      <section id="colecao2">
        <h2>A minha coleção de cromos repetidos</h2>
        <ul id="lista2"></ul>
        <h3>Total de cromos: <span id="total2">0</span></h3>
      </section>
    </main>
    <footer>2026, ULusófona</footer>

    <script src="js/main.js"></script>
  </body>
</html>
