<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styleslab2.css" />
    <link rel="stylesheet" href="../lab2/styles.css" />
    <title>Cidade</title>
  </head>

  <body>
    <header>
      <h1>Luanda</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="local.html">Localização</a>
        <a href="multimedia.html">Multimédia</a>
        <a href="info.html">Informação</a>
      </nav>
    </header>

    <main>
      <h2>Multimédia</h2>

      <p>Nesta página encontra conteúdos multimédia.</p>

      <p>
        <a href="#fotografias">Fotografias</a>
        <a href="#video">Vídeo</a>
        <a href="#poesia">Poesia</a>
      </p>

      <section>
        <h3 id="fotografias">Fotografias</h3>

        <div class="fotografias">
          <img src="../lab2/images/foto1.jpeg" alt="Vista da cidade" />
          <img src="../lab2/images/foto2.jpeg" alt="Luanda" />
          <img src="../lab2/images/foto3.jpeg" alt="Rua de Luanda" />
          <img src="../lab2/images/foto4.jpeg" alt="Edifício em Luanda" />
          <img src="../lab2/images/foto5.jpeg" alt="Paisagem de Luanda" />
          <img src="../lab2/images/foto6.jpeg" alt="Cidade de Luanda" />
          <img
            src="../lab2/images/foto7.jpeg"
            alt="Edifício de Luanda à noite"
          />
          <img src="../lab2/images/foto8.jpeg" alt="Luanda" />
        </div>
      </section>

      <section>
        <h3 id="video">Vídeo</h3>

        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/yc8IfT-L4cw?si=6dHHFgpKScqv8bQc"
          title="Vídeo sobre Luanda"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </section>

      <section>
        <h3 id="poesia">Poesia</h3>

        <div class="poema">
          <p>Luanda, cidade junto ao mar,</p>
          <p>onde o sol começa a brilhar,</p>
          <p>entre ruas, sonhos e calor,</p>
          <p>terra de vida, força e amor.</p>
        </div>
      </section>
    </main>

    <footer>
      <p>Luanda, 2026</p>
    </footer>
  </body>
</html>
